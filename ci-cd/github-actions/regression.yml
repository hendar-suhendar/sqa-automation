name: SQA - Regression Test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Test environment"
        required: true
        default: "sit"
        type: choice
        options:
          - dev
          - sit
          - uat

  schedule:
    - cron: "0 17 * * 1-5"

jobs:
  regression-test:
    name: Regression Test
    runs-on: ubuntu-latest

    env:
      TEST_ENV: ${{ github.event.inputs.environment || 'sit' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Regression Test
        run: npm run test:regression

      - name: Generate Allure Report
        if: always()
        run: npm run report:allure

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-playwright-report
          path: reports/playwright-report/
          retention-days: 14

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-allure-results
          path: reports/allure-results/
          retention-days: 14

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-allure-report
          path: reports/allure-report/
          retention-days: 14